name: Emulator language test (no release APK)

on:
  workflow_dispatch:

jobs:
  language-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug app
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Run language test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/emulator/repro.sh

      - name: Show results
        if: always()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::notice title=Results::$(cat emulator-out/results.txt 2>/dev/null | enc)"
          echo "::warning title=Fatal exceptions::$(head -c 3500 emulator-out/fatal.txt 2>/dev/null | enc)"
          for f in emulator-out/crash_*.txt; do
            [ -s "$f" ] && echo "::error title=$(basename $f)::$(head -c 3000 "$f" | enc)"
          done
          for f in emulator-out/trail_*.txt; do
            case "$f" in *inapp_fr*|*sys_zh-CN*|*sys_ar*) echo "::notice title=$(basename $f)::$(tail -n 30 "$f" | enc)";; esac
          done
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-out
          path: emulator-out/
